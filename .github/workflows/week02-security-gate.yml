# Sandbox/teaching only; for authorized lab use.
#
# Week 2 — Task 6: security CI gate.
# Adapted from labs/week15-devsecops-pipeline/security-ci.yml.
#
# Runs three security tools against the term-project target (NoteVault) and
# FAILS the build on HIGH/CRITICAL:
#   - Semgrep  (SAST)      p/default + p/owasp-top-ten
#   - Trivy    (SCA + IaC) dependency CVEs + Dockerfile misconfig
#   - Gitleaks (secrets)   hardcoded credential scan
#
# Each job is split in two: a REPORT step that prints findings without failing,
# then a GATE step that re-runs with non-zero exit so the build actually breaks.
# Splitting them means the log always shows *what* was found before it dies.
#
# Scope note: this scans project/starter-app only, not the whole repo. The repo
# deliberately keeps insecure teaching material under labs/, and .semgrepignore /
# .gitleaks.toml / Trivy skip-dirs exclude it. Pointing the gate at the project
# target keeps the result meaningful and matches the manual scans in Task 5.
#
# Changed from the Week 15 template: renamed, retargeted to this branch and to
# project/starter-app, and the SARIF upload steps were removed (they require a
# GitHub API token and cannot run under `act` locally).

name: week02-security-gate

on:
  push:
    branches: [wk02_6631503046]
  workflow_dispatch:

# No SARIF upload, so read access is all this needs.
permissions:
  contents: read

env:
  TARGET: project/starter-app

jobs:
  # ---------------------------------------------------------------
  # 1) SAST — Semgrep scans source for insecure patterns.
  # ---------------------------------------------------------------
  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@v4

      # Guard: a gate that passes because it scanned nothing is worse than one that
      # fails loudly. Under act the Semgrep gate reported success on a target that
      # Task 5 had already shown contains 31 findings, so fail fast if the path or
      # the ruleset is missing rather than reporting a green build.
      - name: Guard — target exists and rules loaded
        run: |
          test -d "$TARGET" || { echo "::error::scan target '$TARGET' not found"; exit 1; }
          test -f "$TARGET/app.py" || { echo "::error::'$TARGET/app.py' missing — wrong path?"; exit 1; }
          semgrep scan --config p/default --config p/owasp-top-ten --json \
            --output /tmp/sg.json "$TARGET" || true
          n=$(python3 -c "import json;print(len(json.load(open('/tmp/sg.json'))['results']))")
          echo "Semgrep findings: $n"
          test "$n" -gt 0 || { echo "::error::0 findings — ruleset almost certainly failed to load"; exit 1; }

      - name: Report — Semgrep findings
        run: |
          semgrep scan \
            --config p/default \
            --config p/owasp-top-ten \
            "$TARGET" || true

      - name: Gate — fail on Semgrep findings
        # `--error` makes Semgrep exit non-zero when findings exist.
        run: |
          semgrep scan \
            --config p/default \
            --config p/owasp-top-ten \
            --error \
            "$TARGET"

  # ---------------------------------------------------------------
  # 2) Trivy — filesystem (SCA) + IaC/Dockerfile config scan.
  # ---------------------------------------------------------------
  trivy:
    name: SCA + IaC (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # NOTE: this workflow is meant to run on GitHub Actions, not under `act`.
      # Two things break locally that do not break on a GitHub runner:
      #   1. aquasecurity/trivy-action fetches its install script via actions/checkout,
      #      which needs a GITHUB_TOKEN. GitHub injects one automatically; act has none.
      #   2. Calling `docker run -v "$PWD:/src"` from inside a job is a trap: the -v path
      #      is resolved by the host daemon, but $PWD is the path *inside* the job
      #      container. On a GitHub runner those are the same machine so it works; under
      #      act they differ, so Trivy mounted an empty dir and reported
      #      "lstat /src/project/starter-app: no such file or directory".

      # --- Dependency (SCA) scan: report only ---
      - name: Report — Trivy fs (SCA)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: project/starter-app
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: "0"          # report only; the gate step enforces failure

      # --- IaC / Dockerfile misconfiguration scan: report only ---
      - name: Report — Trivy config (IaC)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: project/starter-app
          severity: HIGH,CRITICAL
          exit-code: "0"

      # --- GATE: re-scan with exit-code 1 so HIGH/CRITICAL FAILS the build ---
      - name: Gate — fail on HIGH/CRITICAL (SCA)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: project/starter-app
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"          # <-- real failure semantics, not `|| true`

      - name: Gate — fail on HIGH/CRITICAL (IaC)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: project/starter-app
          severity: HIGH,CRITICAL
          exit-code: "1"

  # ---------------------------------------------------------------
  # 3) Gitleaks — secret scanning over the project target.
  #    --no-git because project/starter-app is a subdirectory, not its own repo.
  # ---------------------------------------------------------------
  gitleaks:
    name: Secrets (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Report — Gitleaks scan
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --no-git -s "/repo/$TARGET" -v --exit-code 0 || true

      - name: Gate — fail if any secret found
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --no-git -s "/repo/$TARGET" -v --exit-code 1
